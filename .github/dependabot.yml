version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5

  # As actions ficam fixadas na versão principal validada pelo squad;
  # atualizações chegam por PR e passam pela esteira como qualquer mudança.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
